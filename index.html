<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RESVP is available on iOS. Feel your city's pulse through the music and places around you.">
  <meta name="theme-color" content="#7A1220">
  <title>discover your city's sound.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260918-1">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__content">
        <img class="hero__logo" src="assets/logo.svg" alt="RESVP logo" width="1254" height="1254">
        <h1 id="hero-title">Discover your city's sound with RESVP.</h1>
        <p class="hero__subhead">See what your city is listening to and share the songs that move you.</p>
        <div class="hero__availability">
          <span class="hero__availability-text">Download on the</span>
          <a class="app-store-badge" href="https://apps.apple.com/de/app/resvp-your-citys-sound/id6792691676" aria-label="Download RESVP on the App Store">
            <span class="app-store-badge__mark"></span>
            <span class="app-store-badge__copy">
              <span>App Store</span>
            </span>
          </a>
        </div>
      </div>

      <div class="device-stage" aria-label="RESVP app preview">
        <figure class="iphone iphone--rear iphone--rendered">
          <img class="iphone__render" src="assets/map-phone-3d.png" alt="Map tab preview" width="2309" height="4233">
        </figure>

        <figure class="iphone iphone--front iphone--rendered">
          <img class="iphone__render" src="assets/live-phone-3d.png" alt="Live tab preview" width="2309" height="4233">
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer">
      <a href="https://www.instagram.com/resvp.app" aria-label="RESVP on Instagram">@resvp.app</a>
      <a href="https://getresvp.app">getresvp.app</a>
      <a href="/terms/">Terms</a>
      <a href="/privacy/">Privacy</a>
      <a href="/impressum/">Impressum</a>
    </nav>
    <p>&copy; 2026 RESVP. All rights reserved.</p>
  </footer>
</body>
</html>
